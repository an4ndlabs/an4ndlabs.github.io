<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anand Kumar</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #5f6b76;
    --border: #e1e5ea;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --card: #181c22;
      --text: #eef1f4;
      --muted: #9aa5b1;
      --border: #272d35;
      --accent: #6ea0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 28px; margin: 0 0 6px; text-align: center; }
  p.sub { color: var(--muted); text-align: center; margin: 0 0 32px; font-size: 15px; }
  a.link {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--text);
  }
  a.link:hover, a.link:focus { border-color: var(--accent); }
  a.link strong { display: block; font-size: 16px; }
  a.link span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Anand Kumar</h1>
  <p class="sub">My accounts, all in one place</p>

  <a class="link" href="https://github.com/login" target="_blank" rel="noopener">
    <strong>GitHub</strong>
    <span>Log in</span>
  </a>

  <a class="link" href="https://app.tuta.com/login" target="_blank" rel="noopener">
    <strong>Tuta Mail</strong>
    <span>Log in</span>
  </a>

  <a class="link" href="https://en.wikipedia.org/w/index.php?title=Special:UserLogin" target="_blank" rel="noopener">
    <strong>Wikipedia</strong>
    <span>Log in</span>
  </a>

  <a class="link" href="https://archive.org/account/login" target="_blank" rel="noopener">
    <strong>Internet Archive</strong>
    <span>Log in</span>
  </a>
</main>
</body>
</ht
